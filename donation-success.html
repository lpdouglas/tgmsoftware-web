<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donation Successful - TGM Software</title>

    <style>
        :root {
            --bg: #0e0e13;
            --card: #1a1a24;
            --text: #eaeaf0;
            --muted: #b0b0c3;
            --accent: #7aa2ff;
            --success: #4ade80;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            padding: 64px 24px;
            text-align: center;
            background: linear-gradient(135deg, #1f1f2f, #2b2b45);
        }

        header h1 {
            margin: 0;
            font-size: 2.6rem;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 12px;
            font-size: 1.1rem;
            color: var(--muted);
        }

        main {
            max-width: 900px;
            margin: 48px auto;
            padding: 0 24px;
        }

        .success-container {
            background-color: var(--card);
            padding: 48px 24px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h2 {
            font-size: 2rem;
            color: var(--success);
            margin: 0 0 12px 0;
        }

        p {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        .details {
            background-color: #0e0e13;
            padding: 16px;
            border-radius: 6px;
            margin: 24px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2e2e3f;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--muted);
            font-weight: 600;
        }

        .detail-value {
            color: var(--success);
            font-weight: 600;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        button {
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
            margin-top: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 32px 16px;
            background-color: #0a0a10;
            color: #8a8aa3;
            font-size: 0.9rem;
            margin-top: 48px;
        }
    </style>
</head>
<body>

<header>
    <h1>TGM Software</h1>
    <p id="header-subtitle">Thank You for Your Support!</p>
</header>

<main>
    <div class="success-container">
        <div id="icon" class="success-icon">✓</div>
        <h2 id="title">Donation Successful!</h2>
        <p id="message">We truly appreciate your generous support.</p>
        
        <div class="details">
            <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span id="status" class="detail-value">Confirmed</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment ID:</span>
                <span id="payment-id" class="detail-value">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Timestamp:</span>
                <span id="timestamp" class="detail-value"></span>
            </div>
        </div>

        <p id="thanks-message">Your contribution helps us continue developing exciting games and tools. Thank you!</p>
        
        <button onclick="window.location.href='index.html'">Return to Home</button>
    </div>
</main>

<footer>
    © 2026 TGM Software. All rights reserved.
</footer>

<script>
    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const paymentIntent = urlParams.get('payment_intent');
    const redirectStatus = urlParams.get('redirect_status');

    // Set the payment ID
    if (paymentIntent) {
        document.getElementById('payment-id').textContent = paymentIntent.substring(0, 20) + '...';
    }

    // Handle different redirect statuses
    if (redirectStatus === 'succeeded') {
        document.getElementById('icon').textContent = '✓';
        document.getElementById('title').textContent = 'Donation Successful!';
        document.getElementById('status').textContent = 'Confirmed';
        document.getElementById('message').textContent = 'We truly appreciate your generous support.';
        document.getElementById('thanks-message').textContent = 'Your contribution helps us continue developing exciting games and tools. Thank you!';
    } else if (redirectStatus === 'processing') {
        document.getElementById('icon').textContent = '⏳';
        document.getElementById('title').textContent = 'Processing...';
        document.getElementById('status').textContent = 'Processing';
        document.getElementById('message').textContent = 'Your payment is being processed. This may take a few moments.';
        document.getElementById('thanks-message').textContent = 'We will send you a confirmation email shortly.';
    } else if (redirectStatus === 'requires_action') {
        document.getElementById('icon').textContent = '⚠';
        document.getElementById('title').textContent = 'Action Required';
        document.getElementById('status').textContent = 'Requires Action';
        document.getElementById('message').textContent = 'Your payment requires additional authentication.';
        document.getElementById('thanks-message').textContent = 'Please check your email for further instructions.';
        document.querySelector('.success-container').style.borderLeft = '4px solid #fbbf24';
    }

    // Set the current timestamp
    document.getElementById('timestamp').textContent = new Date().toLocaleString();
</script>

</body>
</html>
